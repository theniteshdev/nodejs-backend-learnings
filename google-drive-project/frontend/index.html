<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Manager</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <label for="file-uploader">
        <span>Upload File to the Server</span>
        <input type="file" id="file-uploader">

    <p class="uploading-progress">
        File Uploading:
        <span class="actual-progress">0</span>%
    </p>
    <h2>My Files</h2>
    <hr>
    <ul class="files-container"></ul>

</body>

</html>
